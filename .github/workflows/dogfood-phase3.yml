name: dogfood-phase3

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  dogfood:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run phase 3 dogfood
        run: npm run dogfood:phase3

      - name: Upload dogfood reports
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-reports
          path: dogfood/reports/*

name: homebrew-validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  install-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build release artifact
        run: npm run release:build

      - name: Generate local formula
        run: |
          TARBALL_PATH=$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("release/manifest.json","utf8"));process.stdout.write(p.tarballPath)')
          npm run release:formula -- --local-tarball "$TARBALL_PATH" --output "homebrew/Formula/spark-talk.rb"

      - name: Install formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          TAP_NAME="local/spark-test"
          brew untap "$TAP_NAME" || true
          brew tap-new --no-git "$TAP_NAME"
          TAP_REPO="$(brew --repository "$TAP_NAME")"
          mkdir -p "$TAP_REPO/Formula"
          cp ./homebrew/Formula/spark-talk.rb "$TAP_REPO/Formula/spark-talk.rb"
          brew install "$TAP_NAME/spark-talk"
        shell: bash

      - name: Smoke test
        run: spark --version

      - name: Cleanup
        if: always()
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          brew uninstall --formula spark-talk || true
          brew untap local/spark-test || true
        shell: bash
